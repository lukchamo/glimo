<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Glimo, modo inmersivo dentro de un glim</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#FFD43B}
button:focus-visible,a:focus-visible{outline:3px solid #FFD43B;outline-offset:2px}
@keyframes glimoBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.bob{animation:glimoBob 6s ease-in-out infinite}
.bob2{animation:glimoBob 7.5s ease-in-out infinite;animation-delay:-2s}
.bob3{animation:glimoBob 9s ease-in-out infinite;animation-delay:-4s}
.dockbtn:hover{background:#262A8C}
.farglim:hover{background:rgba(255,255,255,0.08)}
@media (prefers-reduced-motion: reduce){.bob,.bob2,.bob3{animation:none}}
@media (max-width: 820px){
  .imm-root{height:auto !important;overflow:visible !important}
  .stage3d{position:static !important;perspective:none !important;display:flex;flex-direction:column;gap:14px;padding:148px 16px 150px}
  .stage3d .fl{position:static !important;transform:none !important;width:auto !important;margin:0 !important}
  .horizon{display:none !important}
  .dock{left:8px !important;right:8px !important;transform:none !important;overflow-x:auto;justify-content:flex-start !important}
  .legend{display:none !important}
}
</style>
</helmet>
<div class="imm-root" style="position: relative; height: 100vh; min-height: 760px; overflow: hidden; background: #12146A; font-family: Figtree, system-ui, sans-serif; color: #FFFFFF">

  <div aria-hidden="true" class="horizon" style="position: absolute; inset: 0; background: radial-gradient(ellipse 60% 40% at 50% 30%, rgba(91, 199, 245, 0.20), rgba(18, 20, 106, 0) 70%)"></div>
  <div aria-hidden="true" class="horizon" style="position: absolute; left: -60%; right: -60%; bottom: -4%; height: 72%; transform-origin: 50% 100%; transform: perspective(700px) rotateX(62deg); background-image: linear-gradient(rgba(140, 147, 240, 0.30) 1px, transparent 1px), linear-gradient(90deg, rgba(140, 147, 240, 0.30) 1px, transparent 1px); background-size: 80px 80px"></div>

  <div class="horizon" aria-label="Los demás glims, a lo lejos" style="position: absolute; left: 0; right: 0; top: 96px; display: flex; justify-content: center; align-items: flex-end; gap: clamp(8px, 2vw, 28px); z-index: 1">
    <sc-for list="{{others}}" as="o" hint-placeholder-count="8">
      <button type="button" class="farglim" onClick="{{o.pick}}" aria-label="Saltar a {{o.name}}" style="border: none; background: transparent; border-radius: 16px; padding: 6px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; font-family: inherit; color: #FFFFFF">
        <dc-import name="Glim" state="{{o.state}}" size="40" hint-size="40px,40px"></dc-import>
        <span style="font-size: 12px; font-weight: 700">{{o.name}}</span>
        <sc-if value="{{o.hasTalk}}" hint-placeholder-val="{{ false }}">
          <span style="font-size: 12px; color: #FFD43B">{{o.talk}}</span>
        </sc-if>
      </button>
    </sc-for>
  </div>

  <div class="stage3d" style="position: absolute; inset: 0; perspective: 1400px; perspective-origin: 50% 38%; transform-style: preserve-3d; z-index: 2; pointer-events: none">

    <section class="fl" aria-label="Lo que ve" style="position: absolute; left: 50%; top: 27%; width: 520px; margin-left: -260px; transform: translateZ(0px) rotateY(-5deg) rotateX(3deg); pointer-events: auto">
      <div class="bob" style="background: #FFFFFF; color: #15173A; border: 6px solid {{cur.body}}; border-radius: 28px; box-shadow: 0 40px 90px rgba(4, 5, 40, 0.55); overflow: hidden">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 18px; border-bottom: 1px solid #E3E5F2; background: #FAFAFE">
          <span style="font-size: 15px; font-weight: 700">{{cur.app}}</span>
          <span style="font-size: 13px; font-weight: 600; color: #4B4F7A">Lo que ve</span>
        </div>
        <div style="padding: 14px 18px 4px">
          <p style="margin: 0; display: inline-flex; align-items: center; gap: 8px; background: #15173A; color: #FFFFFF; border-radius: 12px; padding: 7px 12px; font-size: 14px; font-weight: 600">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFD43B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            {{cur.focus}}
          </p>
        </div>
        <ul style="margin: 0; padding: 6px 10px 10px; list-style: none">
          <sc-for list="{{cur.rows}}" as="r" hint-placeholder-count="4">
            <li style="display: flex; align-items: center; gap: 14px; padding: 11px 8px; border-bottom: 1px solid #EEF0FB">
              <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
                <span style="font-size: 15px; font-weight: 700">{{r.a}}</span>
                <span style="font-size: 14px; color: #2C2F5A">{{r.b}}</span>
              </div>
              <sc-if value="{{r.hasTag}}" hint-placeholder-val="{{ true }}">
                <span style="flex-shrink: 0; font-size: 13px; font-weight: 700; border-radius: 10px; padding: 4px 9px; background: {{r.tagBg}}; color: {{r.tagFg}}">{{r.tag}}</span>
              </sc-if>
            </li>
          </sc-for>
        </ul>
      </div>
    </section>

    <sc-for list="{{cur.thoughts}}" as="th" hint-placeholder-count="4">
      <div class="fl" style="position: absolute; left: {{th.left}}%; top: {{th.top}}%; width: 300px; transform: translate3d(0, 0, {{th.z}}px) rotateY(12deg); pointer-events: auto">
        <div class="{{th.anim}}" style="background: {{th.bg}}; color: #15173A; border-radius: 22px; padding: 12px 16px; box-shadow: {{th.glow}}; display: flex; flex-direction: column; gap: 3px">
          <span style="font-size: 12px; font-weight: 700; color: #4B4F7A">{{th.when}}</span>
          <span style="font-size: 15px; line-height: 1.4">{{th.text}}</span>
        </div>
      </div>
    </sc-for>

    <section class="fl" aria-label="Lo que necesita de ti" style="position: absolute; right: 4%; top: {{act.top}}%; width: 340px; transform: translate3d(0, 0, {{act.z}}px) rotateY(-12deg); pointer-events: auto">
      <div class="bob2" style="background: {{act.bg}}; color: {{act.fg}}; border: 1px solid {{act.border}}; border-radius: 24px; padding: 18px 18px 16px; box-shadow: {{act.shadow}}; display: flex; flex-direction: column; gap: 10px">
        <span style="font-size: 13px; font-weight: 700; color: {{act.sub}}">{{act.kicker}}</span>
        <h2 style="margin: 0; font-family: Unbounded, system-ui, sans-serif; font-weight: 600; font-size: 19px; line-height: 1.25">{{act.title}}</h2>
        <div style="display: flex; gap: 8px; flex-wrap: wrap">
          <button type="button" style="height: 44px; padding: 0 16px; border: none; border-radius: 12px; background: {{act.btnBg}}; color: {{act.btnFg}}; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer">{{cur.primary}}</button>
          <button type="button" style="height: 44px; padding: 0 16px; border: 1px solid {{act.border2}}; border-radius: 12px; background: transparent; color: {{act.fg}}; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">{{cur.secondary}}</button>
        </div>
      </div>
    </section>

    <div class="fl" aria-label="Herramientas que usa" style="position: absolute; left: 50%; top: 74%; width: 520px; margin-left: -260px; transform: translateZ(-90px); pointer-events: auto">
      <div class="bob3" style="display: flex; gap: 8px; flex-wrap: wrap; justify-content: center">
        <sc-for list="{{cur.tools}}" as="t" hint-placeholder-count="3">
          <span style="font-size: 14px; font-weight: 600; background: rgba(255, 255, 255, 0.10); border: 1px solid rgba(255, 255, 255, 0.28); border-radius: 14px; padding: 7px 13px">{{t}}</span>
        </sc-for>
      </div>
    </div>
  </div>

  <header style="position: absolute; left: 0; right: 0; top: 0; z-index: 5; padding: 16px clamp(16px, 2.5vw, 32px); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap">
    <div style="display: flex; align-items: center; gap: 16px">
      <div style="display: flex; align-items: flex-end; gap: 1px" aria-label="glimo">
        <span style="font-family: Unbounded, system-ui, sans-serif; font-weight: 800; font-size: 24px; line-height: 1; letter-spacing: -0.045em; color: #FFFFFF">glim</span>
        <span style="margin-bottom: 3px; display: flex"><dc-import name="Glim" state="idle" size="18" body="#FFFFFF" eye="#12146A" badge="false" alt="o" hint-size="18px,18px"></dc-import></span>
      </div>
      <span aria-hidden="true" style="width: 1px; height: 28px; background: rgba(255, 255, 255, 0.25)"></span>
      <div style="display: flex; align-items: center; gap: 10px">
        <dc-import name="Glim" state="{{cur.state}}" size="40" badge="false" hint-size="40px,40px"></dc-import>
        <div style="display: flex; flex-direction: column">
          <span style="font-family: Unbounded, system-ui, sans-serif; font-weight: 600; font-size: 17px">Dentro de {{cur.name}}</span>
          <span style="font-size: 13px; color: #C7C9F5">{{cur.word}}</span>
        </div>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap">
      <nav aria-label="Tipo de vista" style="display: flex; gap: 4px; background: rgba(255, 255, 255, 0.10); border-radius: 14px; padding: 4px">
        <a href="Mundo.dc.html" style="padding: 10px 14px; border-radius: 10px; font-weight: 600; font-size: 14px; color: #FFFFFF; text-decoration: none">Panel</a>
        <span aria-current="page" style="padding: 10px 14px; border-radius: 10px; background: #FFFFFF; color: #12146A; font-weight: 700; font-size: 14px">Inmersiva</span>
      </nav>
      <a href="Mundo.dc.html" style="height: 44px; padding: 0 16px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.35); display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 14px; text-decoration: none">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
        Volver al mundo
      </a>
    </div>
  </header>

  <p class="legend" style="position: absolute; left: clamp(16px, 2.5vw, 32px); bottom: 32px; z-index: 5; margin: 0; max-width: 230px; display: flex; gap: 8px; align-items: flex-start; font-size: 13px; line-height: 1.4; color: #C7C9F5">
    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFD43B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><circle cx="12" cy="12" r="3"></circle><circle cx="12" cy="12" r="8"></circle></svg>
    Lo que flota más cerca es lo que más te necesita.
  </p>

  <div class="dock" role="toolbar" aria-label="Saltar a otro glim" style="position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 5; display: flex; justify-content: center; gap: 4px; background: #1B1E7A; border: 1px solid #3A3F8F; border-radius: 24px; padding: 6px">
    <sc-for list="{{dock}}" as="d" hint-placeholder-count="9">
      <button type="button" class="dockbtn" onClick="{{d.pick}}" aria-pressed="{{d.pressed}}" style="width: 76px; flex-shrink: 0; padding: 6px 4px; border: 2px solid {{d.border}}; border-radius: 18px; background: {{d.bg}}; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; font-family: inherit; color: #FFFFFF">
        <dc-import name="Glim" state="{{d.state}}" size="40" hint-size="40px,40px"></dc-import>
        <span style="font-size: 12px; font-weight: 700">{{d.name}}</span>
      </button>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {

        thoughts: [['hace 15 min', 'Iba a preparar el informe semanal de ventas.'], ['hace 14 min', 'La llave de la base de datos ya no funciona.'], ['ahora', 'Necesito que renueves el acceso. Mientras, no intento nada más.']],

        })
      },
      act: { kicker: c.kicker, title: c.ask, top: a.top, z: a.z, bg: a.bg, fg: a.fg, sub: a.sub, border: a.border, border2: a.border2, btnBg: a.btnBg, btnFg: a.btnFg, shadow: a.shadow },
      others: G.filter((g) => g.id !== c.id).map((g) => ({ name: g.name, state: g.state, talk: g.talk || '', hasTalk: !!g.talk, pick: pick(g.id) })),
      dock: G.map((g) => ({
        name: g.name, state: g.state, pick: pick(g.id),
        pressed: g.id === c.id ? 'true' : 'false',
        bg: g.id === c.id ? '#2B34D6' : 'transparent',
        border: g.id === c.id ? '#8C93F0' : 'transparent'
      }))
    };
  }
}
</script>
</body>
</html>
