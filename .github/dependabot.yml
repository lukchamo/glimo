version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Pinned on purpose: the browser tests need the exact version whose browsers are installed.
      - dependency-name: "@playwright/test"
      # Node types follow the Node version in .nvmrc.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      dev-tooling:
        patterns:
          ["@biomejs/*", "turbo", "typescript", "vitest", "@playwright/*", "vite", "@vitejs/*"]
      cloudflare:
        patterns: ["wrangler", "@cloudflare/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
