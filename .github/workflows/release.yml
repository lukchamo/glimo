name: release

# Push a tag like v0.1.0 and this checks everything, builds the packages and publishes a
# GitHub release with the notes from CHANGELOG.md and the package tarballs attached.
# If the repository has an NPM_TOKEN secret, the packages are also published to npm.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: check, build, publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ github.ref_name }}
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: The tag matches every package version and the changelog
        run: node scripts/check-version.mjs "$TAG"

      - name: Lint, types and tests
        run: pnpm lint && pnpm typecheck && pnpm test

      - name: Build and pack
        run: |
          pnpm --filter @glimo/spec --filter @glimo/glim build
          mkdir -p release
          pnpm --filter @glimo/spec --filter @glimo/glim --filter glimo exec pnpm pack --pack-destination "$GITHUB_WORKSPACE/release"
          ls -la release

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-notes.mjs "$TAG" > release/notes.md
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" release/*.tgz \
            --title "Glimo ${TAG#v}" \
            --notes-file release/notes.md \
            --verify-tag $prerelease

      - name: Publish to npm (only when the NPM_TOKEN secret exists)
        if: ${{ env.HAS_NPM_TOKEN == 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Signed provenance needs a public repository.
          PROVENANCE: ${{ github.event.repository.private == false && '--provenance' || '' }}
        run: |
          pnpm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"
          pnpm --filter @glimo/spec --filter @glimo/glim --filter glimo publish --access public --no-git-checks $PROVENANCE
